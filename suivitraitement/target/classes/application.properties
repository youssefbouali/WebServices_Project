# Chargement des variables d'environnement
spring.config.import=optional:file:.env[.properties]

# Configuration CORS (avec fallback values)
APP_CORS_ALLOWED_ORIGINS=${ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5000,http://localhost:3000}
APP_CORS_ALLOWED_METHODS=${ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
APP_CORS_ALLOWED_HEADERS=${ALLOWED_HEADERS:*}
APP_CORS_ALLOW_CREDENTIALS=${ALLOW_CREDENTIALS:true}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/suivi_traitement}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin1234}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Profiles Service Configuration
profiles.base-url=${PROFILES_BASE_URL:http://localhost:3000/api/profiles}
profiles.api-token=${PROFILES_API_TOKEN:}

# Server Configuration
server.port=${SERVER_PORT:8002}
server.servlet.context-path=/

# Logging
logging.level.com.example.suivipatients=DEBUG
logging.level.org.springframework.web.cors=DEBUG
logging.level.org.springframework.security=DEBUG