name: SuiviTraitement CI

on:
  push:
    paths:
      - 'suivitraitement/**'
      - '.github/workflows/suivitraitement-ci.yml'
  pull_request:
    paths:
      - 'suivitraitement/**'
      - '.github/workflows/suivitraitement-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit tests
        run: mvn -B -f suivitraitement/pom.xml clean test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: suivitraitement/target/surefire-reports/

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build jar
        run: mvn -B -f suivitraitement/pom.xml -DskipTests package
      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: suivitraitement-jar
          path: suivitraitement/target/*.jar

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./suivitraitement
          push: false
          tags: healthtrack/suivitraitement:latest

