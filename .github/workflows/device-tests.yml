name: Device Module Tests

on:
  push:
    paths:
      - 'device/**'
      - '.github/workflows/device-tests.yml'
  pull_request:
    paths:
      - 'device/**'
      - '.github/workflows/device-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r device/requirements.txt

      - name: Run tests
        run: |
          python -m pytest device/tests -q

