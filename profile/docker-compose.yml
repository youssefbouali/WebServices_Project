version: '3.8'

services:
  # ==========================================
  # MongoDB - Profile Service Database
  # ==========================================
  mongo:
    image: mongo:5.0
    container_name: healthtrack_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: healthtrack
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - healthtrack_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/healthtrack --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ==========================================
  # Profile Service - Node.js + TypeScript + MongoDB
  # ==========================================
  profile_service:
    build:
      context: ./profile
      dockerfile: Dockerfile
    container_name: healthtrack_profile_service
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGO_URL=mongodb://mongo:27017/healthtrack
      - PORT=3000
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - healthtrack_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================
  # Mongo Express - MongoDB Web UI (Optional)
  # ==========================================
  mongo_express:
    image: mongo-express:latest
    container_name: healthtrack_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - healthtrack_network

# ==========================================
# Networks
# ==========================================
networks:
  healthtrack_network:
    driver: bridge
    name: healthtrack_network

# ==========================================
# Volumes
# ==========================================
volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local