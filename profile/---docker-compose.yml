version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: healthtrack-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: healthtrack
    volumes:
      - mongodb_data:/data/db
    networks:
      - healthtrack-network

  profile-service:
    build: .
    container_name: healthtrack-profile-service
    ports:
      - "3000:3000"
    environment:
      MONGO_URL: mongodb://mongodb:27017/healthtrack
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
    depends_on:
    
      - mongodb
    networks:
      - healthtrack-network
    volumes:
      - ./profile/src:/app/src
    command: npm run dev

volumes:
  mongodb_data:

networks:
  healthtrack-network:
    driver: bridge