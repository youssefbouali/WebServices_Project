version: "3.9"

networks:
  device-network:
    name: device-network
    driver: bridge
  profile-network:
    name: profile-network
    driver: bridge
  planification-network:
    name: planification-network
    driver: bridge
  suivitraitement-network:
    name: suivitraitement-network
    driver: bridge
  frontend-network:
    name: frontend-network
    driver: bridge

volumes:
  postgres_device_data:
  influxdb_data:
  mongodb_data:
  sqlserver_data:
  postgres_suivitraitement_data:

services:
  # --- IoT Device App ---
  device_service:
    build: ./device
    container_name: device_service
    ports:
      - "8000:8000"
    depends_on:
      - device_db
      - influxdb
    environment:
      DATABASE_URL: postgresql://device_user:device_pass@device_db:5432/device_db
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: my-token
      INFLUX_ORG: my-org
      INFLUX_BUCKET: iot_data
    networks:
      - device-network

  device_db:
    image: postgres:15
    container_name: device_db
    restart: always
    environment:
      POSTGRES_USER: device_user
      POSTGRES_PASSWORD: device_pass
      POSTGRES_DB: device_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_device_data:/var/lib/postgresql/data
    networks:
      - device-network

  influxdb:
    image: influxdb:2.6
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin123
      DOCKER_INFLUXDB_INIT_ORG: my-org
      DOCKER_INFLUXDB_INIT_BUCKET: iot_data
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - device-network

  # --- Profile ---
  mongodb:
    image: mongo:4.4
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: healthtrack
    volumes:
      - mongodb_data:/data/db
    networks:
      - profile-network

  profile_service:
    build: ./profile
    container_name: profile_service
    ports:
      - "3000:3000"
    environment:
      MONGO_URL: mongodb://mongodb:27017/healthtrack
      JWT_SECRET: ${JWT_SECRET:-defaultsecret}
      PORT: 3000
    depends_on:
      - mongodb
    networks:
      - profile-network
    restart: always

  # --- Spring Boot avec SQL Server ---
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      SA_PASSWORD: "P@ssw0rd1234"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped
    networks:
      - planification-network

  planification_service:
    build: ./planification
    ports:
      - "8082:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://db:1433;databaseName=master;encrypt=true;trustServerCertificate=true;
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: P@ssw0rd1234
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    command: sh -c "sleep 120 && java -jar app.jar"
    restart: unless-stopped
    networks:
      - planification-network

  # --- Spring Boot Suivi Traitement ---
  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: suivi_traitement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin1234
    ports:
      - "5434:5432"
    volumes:
      - postgres_suivitraitement_data:/var/lib/postgresql/data
    networks:
      - suivitraitement-network

  suivitraitement_service:
    build: ./suivitraitement
    container_name: suivitraitement_service
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/suivi_traitement
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin1234
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SERVER_PORT: 8002
      ALLOWED_ORIGINS: http://localhost:5000,http://localhost:8080,http://localhost:3000
    ports:
      - "8002:8002"
    restart: always
    networks:
      - suivitraitement-network

  # --- Frontend Next.js ---
  frontend_service:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      NODE_ENV: development
    restart: unless-stopped
    networks:
      - frontend-network
